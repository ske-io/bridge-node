name: publish

# A published GitHub release goes to npm through trusted publishing: npm
# trusts this workflow and its environment, so no token is stored, and the
# package carries a provenance statement. A manual run builds and packs
# without publishing, to inspect what would ship (with the placeholder
# version, since there is no tag).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The version comes from the release tag: package.json keeps a
      # placeholder, so a release tagged v0.1.2 builds 0.1.2 with no bump to
      # merge first. A manual run packs the placeholder and publishes nothing.
      - name: Set the version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Pack
        run: npm pack

      # npm never takes a version twice, so a release whose tag isn't
      # v<version> (a typo, a tag without the v) stops here rather than
      # publishing the wrong version.
      - name: Check the release version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(tar -xOzf ./*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match the packed version v$version"
            exit 1
          fi

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      id-token: write

    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish ./*.tgz --access public --provenance
