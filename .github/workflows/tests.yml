name: tests

on:
  push:
    branches:
      - '*.*.x'
  pull_request:
  # Applications install the newest framework versions the peer ranges
  # allow; a weekly run catches an upstream release that breaks the tests
  # even when nothing here changes.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Every Node the package supports: the minimum in package.json's engines
    # exactly, and the newest of each major (test/packaging.test.ts checks
    # the minimum is listed).
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22', '24', '26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check
